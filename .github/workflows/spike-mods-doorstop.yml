# Spike S-M1 (docs/13-mods.md §5): BepInEx loaded by valheim_server.exe from a folder outside its own, through Unity
# Doorstop's launch arguments. Runs only on its spike branch or by hand; nothing here is shipped.
name: Spike S-M1

on:
  push:
    branches: [spike/mods-doorstop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doorstop:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the spike
        shell: pwsh
        run: ./spikes/s-m1-doorstop/run.ps1 -Root "$env:RUNNER_TEMP\sm1"
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s-m1-logs
          path: ${{ runner.temp }}/sm1/logs
          if-no-files-found: warn
