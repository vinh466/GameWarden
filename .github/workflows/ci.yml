# What fits GitHub-hosted runners (ADR-0012, docs/10-build-test-release.md §2-3).
# Windows-bound behaviour (admin rights, service, reboot, real games) is tested by hand on the VM.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check links and diagrams
        run: node build/check-docs.mjs

  dotnet:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build GameWarden.slnx -c Release
      - name: Test (Unit, Api, Windows without admin)
        run: dotnet test --solution GameWarden.slnx -c Release --no-build
