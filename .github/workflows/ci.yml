# What fits GitHub-hosted runners, on Linux and Windows (ADR-0017, docs/10-build-test-release.md §2-3).
# Windows-bound behaviour (admin rights, service, reboot, real games) is tested by hand on the VM.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check links and diagrams
        run: node build/check-docs.mjs

  # Core, the CLI and the Runner on the development platform (ADR-0016); the Windows tier skips itself.
  dotnet-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore GameWarden.slnx
      - name: Build
        run: dotnet build GameWarden.slnx -c Release --no-restore
      # Core's build writes the OpenAPI document the panel's client is generated from (docs/11 §9).
      - name: OpenAPI document is up to date
        run: |
          git add --intent-to-add panel/openapi
          git diff --exit-code -- panel/openapi || { echo "::error::panel/openapi is stale: build Core and commit the document."; exit 1; }
      - name: Test (Unit, Api, Integration; Windows skips itself)
        run: dotnet test --solution GameWarden.slnx -c Release --no-build

  dotnet:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build GameWarden.slnx -c Release
      # Core's build writes the OpenAPI document the panel's client is generated from (docs/11 §9).
      - name: OpenAPI document is up to date
        shell: bash
        run: |
          git add --intent-to-add panel/openapi
          git diff --exit-code -- panel/openapi || { echo "::error::panel/openapi is stale: build Core and commit the document."; exit 1; }
      - name: Test (Unit, Api, Integration, Windows without admin)
        run: dotnet test --solution GameWarden.slnx -c Release --no-build

  # The web panel (docs/11 §11): generated client, types, lint, format, tests, build.
  panel:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - run: npm ci
      - name: Generated API client is up to date
        run: |
          npm run gen:api
          git add --intent-to-add src/api/generated
          git diff --exit-code -- src/api/generated || { echo "::error::src/api/generated is stale: run 'npm run gen:api' in panel/ and commit."; exit 1; }
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Test
        run: npm test
      # Type check, then the production build; Vite prints each chunk's gzip size (budget: docs/11 §10 rule 9).
      - name: Type check and build
        run: npm run build

  # The built panel on a real Core with FakeGame (docs/11 §11): setup, create, start, console, stop, sign out.
  # No admin rights: isolation is off, as in development. Edge is preinstalled on the runner.
  e2e:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - name: Build Core and the panel
        shell: pwsh
        run: |
          dotnet build GameWarden.slnx -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location panel
          npm ci; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Copy-Item -Recurse panel/dist src/GameWarden.Core/bin/Release/net10.0/wwwroot
      - name: Smoke test
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'gamewarden'
          $env:GW_OUT = Join-Path $env:RUNNER_TEMP 'e2e'
          New-Item -ItemType Directory -Force $env:GW_OUT | Out-Null
          $core = Start-Process -PassThru -NoNewWindow -FilePath src/GameWarden.Core/bin/Release/net10.0/GameWarden.Core.exe `
            -ArgumentList "--GameWarden:DataRoot=$data\data", "--GameWarden:CliTokenPath=$data\cli.token", '--GameWarden:PanelPort=18765', '--GameWarden:Isolation=off'
          try {
            for ($i = 0; $i -lt 60 -and -not (Test-Path "$data\cli.token"); $i++) { Start-Sleep -Milliseconds 500 }
            $env:GW_TOKEN_FILE = "$data\cli.token"
            $env:GW_FAKEGAME = (Resolve-Path tests/FakeGame/bin/Release/net10.0/FakeGame.exe).Path
            node panel/e2e/smoke.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Stop-Process -Id $core.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e
          retention-days: 7

  # Unsigned build of main for the VM (10 §7): Setup.exe for a first install, or the zip for
  # "gamewarden update --from <zip> --allow-unsigned".
  dev-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: dotnet
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - name: Package
        shell: pwsh
        run: ./build/package.ps1 -Suffix "dev.${{ github.run_number }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-build
          path: |
            artifacts/GameWarden-*.zip
            artifacts/GameWarden-Setup-*.exe
            artifacts/SHA256SUMS
          retention-days: 14
