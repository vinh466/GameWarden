# Release on a version tag (docs/10-build-test-release.md §4, ADR-0013): vX.Y.Z is a release, vX.Y.Z-rc.N a pre-release.
# Only this workflow's "release" environment (tags v* only) holds the update signing key.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    environment: release
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # build provenance attestations
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Version from the tag
        id: version
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "Tag $env:TAG is not vMAJOR.MINOR.PATCH[-pre]" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-'))".ToLowerInvariant() >> $env:GITHUB_OUTPUT

      - name: Build and test
        shell: pwsh
        run: |
          dotnet build GameWarden.slnx -c Release "-p:Version=${{ steps.version.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test --solution GameWarden.slnx -c Release --no-build

      - name: Package
        shell: pwsh
        run: ./build/package.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Sign SHA256SUMS
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: ./build/sign-manifest.ps1 -Sums artifacts/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/GameWarden-*-win-x64.zip
            artifacts/GameWarden-Setup-*.exe

      - name: Create the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          $assets = @(
            "artifacts/GameWarden-Setup-$env:VERSION.exe",
            "artifacts/GameWarden-$env:VERSION-win-x64.zip",
            "artifacts/SHA256SUMS",
            "artifacts/SHA256SUMS.sig"
          )
          $flags = @("--title", "GameWarden $env:VERSION", "--generate-notes", "--verify-tag")
          if ($env:PRERELEASE -eq "true") { $flags += "--prerelease" }
          gh release create $env:TAG @assets @flags
