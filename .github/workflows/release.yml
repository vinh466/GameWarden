# Release on a development tag (docs/10-build-test-release.md §4, ADR-0027): vX.Y.Z-dev.N is a pre-release.
# Only this workflow's "release" environment (tags v* only) holds the update signing key.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same gate as main: docs, dotnet Linux/Windows, panel, e2e. The dev-build job inside ci.yml is skipped because
  # this is not a push to main.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: ci
    runs-on: windows-2025
    environment: release
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # build provenance attestations
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # The web panel is built by package.ps1 (panel/.npmrc: no install scripts run).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Version from the tag
        id: version
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+-dev\.(0|[1-9]\d*)$') {
            throw "Tag $env:TAG is not vMAJOR.MINOR.PATCH-dev.N (this line has no stable releases)"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=true" >> $env:GITHUB_OUTPUT

      - name: Tag is on main
        shell: pwsh
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag $env:TAG is not on main." }

      - name: Package
        shell: pwsh
        run: ./build/package.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Sign SHA256SUMS
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: ./build/sign-manifest.ps1 -Sums artifacts/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/GameWarden-*-win-x64.zip
            artifacts/GameWarden-Setup-*.exe

      - name: Create the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $assets = @(
            "artifacts/GameWarden-Setup-$env:VERSION.exe",
            "artifacts/GameWarden-$env:VERSION-win-x64.zip",
            "artifacts/SHA256SUMS",
            "artifacts/SHA256SUMS.sig"
          )
          $flags = @("--title", "GameWarden $env:VERSION", "--prerelease", "--verify-tag")
          $notes = "docs/releases/$env:VERSION.md"
          if (Test-Path $notes) {
            $flags += @("--notes-file", $notes)
          } else {
            $flags += @(
              "--notes",
              "Development release. Data may change. Before updating, back up C:\GameWarden\instances and C:\GameWarden\db, then read the update confirmation in the panel."
            )
            Write-Warning "No $notes; published the safe data warning instead."
          }
          gh release create $env:TAG @assets @flags
