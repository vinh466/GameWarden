version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ['*']
  # Majors arrive one by one: the panel's toolchain follows Mantine's template (docs/11 §7).
  - package-ecosystem: npm
    directory: /panel
    schedule:
      interval: weekly
    groups:
      panel:
        update-types: [minor, patch]
    ignore:
      # The types follow the Node.js LTS line the panel is built with (24: CI, package.ps1, CONTRIBUTING).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
